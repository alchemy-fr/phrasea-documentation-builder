server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    port_in_redirect off;

    access_log  /dev/stdout  main;
    error_log   /dev/stderr warn;

    root   /usr/share/nginx/html;

    # Repeated in every location declaring its own add_header, which disables the inheritance
    include /etc/nginx/snippets/headers.conf;

    error_page 404 /404.html;

    location = /fr {
        try_files $uri /fr/index.html;
    }

    # Docusaurus i18n: FR pages are generated under /fr/* and have their own 404 page.
    location ^~ /fr/ {
        error_page 404 /fr/404.html;
        error_page 500 502 503 504 /50x.html;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|jpg|jpeg|gif|png|css|tgz|gz|rar|bz2|doc|pdf|ppt|tar|wav|bmp|rtf|swf|ico|flv|txt|woff|woff2|svg)$ {
        expires 30d;
        add_header Pragma "public";
        add_header Cache-Control "public";
        include /etc/nginx/snippets/headers.conf;
    }

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
